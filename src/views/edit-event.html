<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event - Club Events</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { margin-top: 0; font-size: 1.5rem; color: #333; text-align: center; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #555; }
        input, textarea { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        textarea { resize: vertical; height: 100px; }
        button { width: 100%; padding: 0.75rem; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: #dc3545; background: #f8d7da; padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; text-align: center; display: none; }
        .loading { text-align: center; color: #666; font-style: italic; padding: 2rem; }
        .empty { text-align: center; color: #888; padding: 2rem; display: none; }
        .form-container { display: none; }
        .back { text-align: center; margin-top: 1rem; }
        .back a { color: #007bff; text-decoration: none; }
        .back a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Edit Event</h1>
        
        <!-- Loading State -->
        <div id="loading-state" class="loading">Loading event details...</div>

        <!-- Empty State -->
        <div id="empty-state" class="empty">
            <p>No event found or event data is empty.</p>
            <p>Please return to the events list and select a valid event to edit.</p>
        </div>

        <!-- Error State -->
        <div id="error-state" class="error"></div>

        <!-- Form Container -->
        <div id="form-container" class="form-container">
            <form id="edit-form">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description"></textarea>
                </div>
                <div class="form-group">
                    <label for="date">Date & Time</label>
                    <input type="datetime-local" id="date" name="date" required>
                </div>
                <div class="form-group">
                    <label for="capacity">Capacity (places limit)</label>
                    <input type="number" id="capacity" name="capacity" min="1" required>
                </div>
                <button type="submit" id="submit-btn">Update Event</button>
            </form>
        </div>

        <div class="back">
            <a href="/events">← Back to Events</a>
        </div>
    </div>

    <script>
        const pathParts = window.location.pathname.split('/');
        const eventId = pathParts[2];
        const loadingEl = document.getElementById('loading-state');
        const emptyEl = document.getElementById('empty-state');
        const errorEl = document.getElementById('error-state');
        const formContainerEl = document.getElementById('form-container');
        const editForm = document.getElementById('edit-form');

        async function loadEvent() {
            try {
                const res = await fetch(`/api/events/${eventId}`);
                if (!res.ok) {
                    throw new Error('Failed to load event data (Server returned ' + res.status + ')');
                }
                const event = await res.json();
                if (!event || !event.id) {
                    loadingEl.style.display = 'none';
                    emptyEl.style.display = 'block';
                    return;
                }

                document.getElementById('title').value = event.title || '';
                document.getElementById('description').value = event.description || '';
                document.getElementById('date').value = event.date ? new Date(event.date).toISOString().slice(0, 16) : '';
                document.getElementById('capacity').value = event.capacity || '';

                loadingEl.style.display = 'none';
                formContainerEl.style.display = 'block';
            } catch (err) {
                loadingEl.style.display = 'none';
                errorEl.textContent = err.message || 'An error occurred while loading the event.';
                errorEl.style.display = 'block';
            }
        }

        editForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.style.display = 'none';
            
            const formData = new URLSearchParams(new FormData(editForm));
            try {
                const res = await fetch(`/events/${eventId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                if (!res.ok) {
                    const text = await res.text();
                    throw new Error(text || 'Failed to update event (Status ' + res.status + ')');
                }

                window.location.href = '/events?success=' + encodeURIComponent('Event updated successfully');
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
            }
        });

        loadEvent();
    </script>
</body>
</html>
